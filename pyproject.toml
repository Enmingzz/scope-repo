[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scopd-repro"
version = "0.1.0"
description = "SCOPD and SCOPD+ core training and versioned visual evaluation"
requires-python = ">=3.11"

[tool.setuptools]
py-modules = ["train_scopd"]

[tool.setuptools.packages.find]
include = ["scopd*", "scopd_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
